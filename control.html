<style>
  body { background:#070E46; font-family:"Lato",sans-serif; color:#F7F8F8; }
  h1,h2,h3 { font-family:"Source Serif 4",serif; }
  ::selection { background:#001391; color:#F7F8F8; }
  /* Panel de cristal oscuro: legible sobre el fondo difuminado */
  .glass { background:rgba(10,18,74,.62); border:1px solid rgba(133,200,255,.18); }
  .chip { background:rgba(10,18,74,.72); border:1px solid rgba(133,200,255,.30); }
  input,select { color-scheme:dark; }
  input[type=number],select { background:rgba(7,14,70,.6); border:1px solid rgba(133,200,255,.25); border-radius:.6rem; padding:.35rem .5rem; }

    background:radial-gradient(120% 95% at 50% 40%, rgba(7,14,70,.25) 0%, rgba(7,14,70,.8) 100%); }

</head>
<body>

<!-- ===================== PUERTA DE ACCESO ===================== -->
<div id="auth-gate" style="position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:rgba(7,14,70,.8)">
  <div class="glass" style="max-width:28rem;width:100%;border-radius:1.5rem;padding:2.5rem;text-align:center">

<!-- ===================== FONDO 3D ===================== -->

<!-- ===================== APP ===================== -->
<div id="app" class="relative z-10 mx-auto max-w-7xl px-5 py-7">

      <h1 class="text-2xl font-bold text-sand md:text-3xl">Control RDR</h1>

    </div>
    <div class="flex items-center gap-3">

  <!-- Tabs -->
  <nav id="tabs" class="mb-6 flex flex-wrap gap-2">
    <button data-tab="iniciativas" class="tab chip rounded-full px-5 py-2.5 text-sm font-bold">Iniciativas</button>

  <p class="mt-8 text-center text-xs text-sand/40">
    Simulaciones 100% en cliente — no modifican el Excel. Sólo lectura del snapshot del backend.
  </p>
</div>

<script type="module">
/* ===========================================================================
 * THREE.js — núcleo de datos de fondo (difuminado, discreto)
 * =========================================================================== */
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
(function init3D(){
  const canvas = document.getElementById("bg3d");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(1);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
  camera.position.z = 5;
  const geo = new THREE.IcosahedronGeometry(1.6, 1);
  const wire = new THREE.LineSegments(new THREE.WireframeGeometry(geo),
    new THREE.LineBasicMaterial({ color:0x85C8FF, transparent:true, opacity:0.55 }));
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.05, 2),
    new THREE.MeshBasicMaterial({ color:0x1D7CF4, transparent:true, opacity:0.35 }));
  scene.add(wire, core);
  function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  addEventListener("resize", resize); resize();
  (function loop(t){ wire.rotation.y = core.rotation.y = t*0.0001; wire.rotation.x = t*0.00006;
    renderer.render(scene, camera); requestAnimationFrame(loop); })(0);
})();

/* ===========================================================================
 * MOTOR DE SIMULACIÓN (inlined desde lib/simulation.js)
 * =========================================================================== */
const num = (v) => { const n = typeof v === "number" ? v : parseFloat(v); return isNaN(n) ? 0 : n; };
function horasImputadas(p){ const t=p.horasTeoricas||[],a=p.ausencias||[],d=p.dedicacion||[]; let h=0;
  for(let m=0;m<t.length;m++) h+=(num(t[m])-num(a[m]))*num(d[m]); return h; }
function costePersonaQ(p){ return num(p.costeHora)*horasImputadas(p); }
function costesEquipo(ps){ let NFQ=0,NTER=0; (ps||[]).forEach(p=>{ const c=costePersonaQ(p);
  if(p.equipo==="NTER")NTER+=c; else NFQ+=c; }); return {NFQ,NTER,total:NFQ+NTER}; }
function rentObjetivoTotal(cN,cT,oN=0.25,oT=0.20){ const t=cN+cT; if(!t)return 0; return (cN/t)*oN+(cT/t)*oT; }
function economiaQ({personas,horasTotalesQ,tarifa,gastos=0,objNFQ=0.25,objNTER=0.20}){
  const c=costesEquipo(personas); const costeTotal=c.total+num(gastos);
  const ingresoReal=num(horasTotalesQ)*num(tarifa); const rObj=rentObjetivoTotal(c.NFQ,c.NTER,objNFQ,objNTER);
  const ingresoObjetivo= rObj<1 ? costeTotal/(1-rObj) : 0;
  return { costeNFQ:c.NFQ, costeNTER:c.NTER, costeTotal, ingresoReal, rentObjetivoTotal:rObj,
    ingresoObjetivo, ingresoObjetivoHoras: tarifa? ingresoObjetivo/num(tarifa):0,
    rentabilidadReal: ingresoReal? 1-costeTotal/ingresoReal : null }; }
function aplicarEscenarioPersonas(ps,esc={}){ let r=(ps||[]).slice();
  if(esc.quitar&&esc.quitar.length) r=r.filter(p=>esc.quitar.indexOf(p.nombre)<0);
  if(esc.dedicacion) r=r.map(p=> esc.dedicacion[p.nombre]!=null
    ? {...p, dedicacion:(p.dedicacion||[0,0,0]).map(()=>esc.dedicacion[p.nombre])} : p);
  if(esc.anadir&&esc.anadir.length) r=r.concat(esc.anadir); return r; }
function totalesHorasPorQ(records,qCols,ov={}){ const tot={}; qCols.forEach(q=>tot[q]=0);
  (records||[]).forEach(rec=>{ const k=rec.data?rec.data["Proyecto"]:undefined; const o=ov[k];
    qCols.forEach(q=>{ const v=(o&&q in o)?o[q]:(rec.data?rec.data[q]:0); tot[q]+=num(v); }); }); return tot; }
function coberturaProyecto(p,hQ){ const s=(p.asignaciones||[]).reduce((a,x)=>a+num(x.pct),0);
  return p.horas? (s*num(hQ))/num(p.horas):0; }
function capacidadPersona(nombre,proys,hQ){ let h=0; (proys||[]).forEach(p=>(p.asignaciones||[]).forEach(a=>{
  if(a.persona===nombre) h+=num(p.horas)*num(a.pct); })); return hQ? h/num(hQ):0; }

/* ===========================================================================
 * FORMATO
 * =========================================================================== */
const eur = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const pct = (v)=> v==null? "—" : (v*100).toFixed(1)+"%";
const h   = (v)=> (Math.round(num(v))).toLocaleString("es-ES")+" h";

/* ===========================================================================
 * DATOS: snapshot del backend (o demo si no hay backend)
 * =========================================================================== */
const DEMO = {
  tarifas: { "2026Q1":52.8, "2026":51.22, "2025":51.87 },
  ejecucion: { qColumns:["2026Q1","2026Q2","2026Q3"],
    totalesHorasQ:{"2026Q1":4200,"2026Q2":3500,"2026Q3":1200},
    records:[
      {row:6,data:{Proyecto:"Maestro de Emisiones","2026Q2":800,"2026Q3":0}},
      {row:7,data:{Proyecto:"OTC Fase IV","2026Q2":400,"2026Q3":200}},
      {row:8,data:{Proyecto:"Migración Midas","2026Q2":300,"2026Q3":600}},
    ]},
  economico: { bloques:[
    { q:"2026Q2", rentObjetivoNFQ:0.25, rentObjetivoNTER:0.20, personas:[
      {equipo:"NFQ",nombre:"Bello Gonzalez, Luis",costeHora:15.2,horasTeoricas:[171,168,186],dedicacion:[1,1,1],ausencias:[0,0,0]},
      {equipo:"NFQ",nombre:"Montero Nuñez, Ángela",costeHora:53.7,horasTeoricas:[171,162,186],dedicacion:[1,1,1],ausencias:[0,0,18]},
      {equipo:"NFQ",nombre:"Llorente Cerezuela, Pablo",costeHora:32.0,horasTeoricas:[171,162,186],dedicacion:[1,1,1],ausencias:[0,0,0]},
      {equipo:"NTER",nombre:"Rodriguez Paez, Jose Luis",costeHora:60.3,horasTeoricas:[171,162,186],dedicacion:[1,1,1],ausencias:[0,0,0]},
      {equipo:"NTER",nombre:"Fernandez Garrido, Veronica",costeHora:25.8,horasTeoricas:[171,162,186],dedicacion:[1,1,1],ausencias:[0,0,0]},
    ]},
    { q:"2026Q3", rentObjetivoNFQ:0.25, rentObjetivoNTER:0.20, personas:[
      {equipo:"NFQ",nombre:"Bello Gonzalez, Luis",costeHora:15.2,horasTeoricas:[138,126,177],dedicacion:[1,1,1],ausencias:[0,66,33]},
      {equipo:"NFQ",nombre:"Montero Nuñez, Ángela",costeHora:53.7,horasTeoricas:[138,126,186],dedicacion:[1,1,1],ausencias:[78,30,0]},
      {equipo:"NFQ",nombre:"Llorente Cerezuela, Pablo",costeHora:32.0,horasTeoricas:[138,126,186],dedicacion:[1,1,1],ausencias:[30,30,0]},
      {equipo:"NTER",nombre:"Rodriguez Paez, Jose Luis",costeHora:60.3,horasTeoricas:[138,126,186],dedicacion:[0.5,0.5,0.5],ausencias:[48,36,33]},
    ]},
  ]},
  capacidad: { bloques:[
    { q:"2026Q3", horasQ:360, proyectos:[
      {nombre:"Eventos Corporativos 26Q3", horas:150, asignaciones:[{rol:"responsable",persona:"Pablo",pct:0.05},{rol:"ejecutor",persona:"Iker",pct:0.25}]},
      {nombre:"Migración Midas 26Q3", horas:550, asignaciones:[{rol:"responsable",persona:"Marta",pct:0.2},{rol:"ejecutor",persona:"Laura",pct:0.65}]},
      {nombre:"Adopción IA RDR", horas:390, asignaciones:[{rol:"responsable",persona:"Pablo",pct:0.4},{rol:"ejecutor",persona:"Juanlu",pct:0.7}]},
    ], capacidadPersona:[{persona:"Pablo",capacidad:1.10},{persona:"Iker",capacidad:0.92},{persona:"Marta",capacidad:0.77},{persona:"Laura",capacidad:0.99}]},
  ]},
  iniciativas: [
    { data:{ "Estado":"Finalizado","Q facturación":"2026Q1","Código Pedido":"8542254162","Detalle":"SDATOOL-46848 Institutional Clients","Horas propuesta":205,"Estado facturación":"Cobrada","Horas ejecutadas":205,"¿Ejecutado?":"Finalizado" } },
    { data:{ "Estado":"En curso","Q facturación":"2026Q2","Código Pedido":"-","Detalle":"SDATOOL-51125 Migración Midas 26Q2","Horas propuesta":1325,"Estado facturación":"Bolsa horas","Horas ejecutadas":600,"¿Ejecutado?":"En curso" } },
    { data:{ "Estado":"Finalizado","Q facturación":"2026Q2","Código Pedido":"8542284285","Detalle":"OTC Fase IV 26Q2","Horas propuesta":400,"Estado facturación":"Cobrada","Horas ejecutadas":400,"¿Ejecutado?":"Finalizado" } },
    { data:{ "Estado":"Cancelado","Q facturación":"2026Q2","Código Pedido":"-","Detalle":"Estimación descartada","Horas propuesta":150,"Estado facturación":"-","Horas ejecutadas":0,"¿Ejecutado?":"Cancelado" } },
  ],
  bolsa: [
    { data:{ "Responsable BBVA":"Daría Gonzalez","Proyecto":"Cambio Peticiones XMAS","Horas adelantadas":168,"Horas consumidas":42,"Horas":66 } },
    { data:{ "Responsable BBVA":"","Proyecto":"Estimación Q1 CSVToXML","Horas adelantadas":"","Horas consumidas":60,"Horas":"" } },
  ],
  adelantos: [
    { data:{ "Responsable BBVA":"Alejandro García","Proyecto":"SDATOOL-48154 OSI Gobierno Riesgo","Horas adelantadas":310,"Horas consumidas":55,"Horas":0,"Importe":0 } },
    { data:{ "Responsable BBVA":"Pablo Rodríguez","Proyecto":"SDATOOL-53765 Life Global","Horas adelantadas":274,"Horas consumidas":220,"Horas":54,"Importe":2851.2 } },
  ],
  encuestasQ4: [
    { data:{ "Código de proyecto/servicio":"SDATOOL-46848","NOMBRE DEL PROYECTO/SERVICIO":"Institutional Clients: Onboarding","SATISFACCIÓN ENTREGA":10,"CONSIGUE RESULTADOS":10,"CONOCIMIENTO TÉCNICO ADECUADO":10,"CALIDAD TOTAL NUEVA":10 } },
    { data:{ "Código de proyecto/servicio":"SDATOOL-34546","NOMBRE DEL PROYECTO/SERVICIO":"Calypso Back-Office OTC España","SATISFACCIÓN ENTREGA":9,"CONSIGUE RESULTADOS":10,"CONOCIMIENTO TÉCNICO ADECUADO":9,"CALIDAD TOTAL NUEVA":9 } },
  ],
};

const state = { data:null, demo:false };

async function loadSnapshot(){
  let url=null, token="";
  try {
    const links = await fetch("links/links.json",{cache:"no-store"}).then(r=>r.json());
    url = links.controlBackend && (links.controlBackend.url||links.controlBackend);
    token = links.controlToken || "";
  } catch(e){}
  if (url && url.indexOf("PEGAR_AQUI")<0) {
    try {
      const u = url + (url.indexOf("?")<0?"?":"&") + "action=snapshot" + (token?("&token="+encodeURIComponent(token)):"");
      const res = await fetch(u).then(r=>r.json());
      if (res && res.ok && res.data) { state.data=res.data; state.demo=false; return; }
    } catch(e){}
  }
  state.data = DEMO; state.demo = true;
}

/* ===========================================================================
 * RENDER
 * =========================================================================== */
const panel = document.getElementById("panel");
const KPI = (label,value,accent="serene")=>`
  <div class="glass rounded-2xl p-4">
    <p class="text-[11px] uppercase tracking-wider text-${accent}">${label}</p>
    <p class="mt-1 font-display text-2xl font-bold text-sand">${value}</p>
  </div>`;

let activeTab = "iniciativas";
function setTab(t){ activeTab=t;
  document.querySelectorAll(".tab").forEach(b=>{
    const on=b.dataset.tab===t; b.classList.toggle("bg-white/10",on);
    b.style.borderColor = on? "rgba(133,200,255,.8)":"rgba(133,200,255,.30)";
  });
  ({ iniciativas:renderIniciativas, ejecucion:renderEjecucion, economia:renderEconomia,
     capacidad:renderCapacidad, bolsa:renderBolsa, encuestas:renderEncuestas }[t])();
}

/* ---------- Tabla genérica (estilo cristal) ---------- */
function tableHTML(records, cols){
  if(!records || !records.length) return `<div class="glass rounded-2xl p-6 text-sand/60">Sin datos.</div>`;
  return `<div class="glass overflow-x-auto rounded-2xl p-4"><table class="w-full text-sm">
    <thead><tr class="text-left text-serene/80">${cols.map(c=>`<th class="p-2 ${c.r?'text-right':''}">${c.label}</th>`).join("")}</tr></thead>
    <tbody>${records.map(rec=>{ const d=rec.data||rec; return `<tr class="border-t border-serene/10">${cols.map(c=>{
      let v=d[c.k]; v=c.f? c.f(v,d) : (v==null||v===""?'<span class="text-sand/25">—</span>':v);
      return `<td class="p-2 ${c.r?'text-right':''}">${v}</td>`; }).join("")}</tr>`; }).join("")}</tbody></table></div>`;
}
const badge=(t,c)=>`<span class="chip rounded-full px-2 py-0.5 text-[11px] text-${c}">${t}</span>`;
function estadoBadge(v){ const s=String(v||"").toLowerCase();
  if(s.indexOf("final")>=0) return badge(v,"lime");
  if(s.indexOf("cancel")>=0||s.indexOf("rechaz")>=0) return badge(v,"mandarin");
  if(s.indexOf("curso")>=0||s.indexOf("aprob")>=0||s.indexOf("bolsa")>=0) return badge(v,"serene");
  if(s.indexOf("cobrad")>=0) return badge(v,"lime");
  return badge(v||"—","sand"); }
const hCell=(v)=> v===""||v==null?'':h(v);

/* ---------- INICIATIVAS ---------- */
function renderIniciativas(){
  const recs = state.data.iniciativas || [];
  const qs = Array.from(new Set(recs.map(r=>r.data["Q facturación"]).filter(Boolean))).sort();
  const fq = state._iniQ || "Todos";
  const filtered = recs.filter(r=> fq==="Todos" || r.data["Q facturación"]===fq);
  panel.innerHTML = `
    <div class="mb-4 flex flex-wrap items-center gap-3">
      <label class="text-xs text-serene/80">Q facturación
        <select id="ini-q" class="ml-2"><option>Todos</option>${qs.map(q=>`<option ${q===fq?"selected":""}>${q}</option>`).join("")}</select></label>
      <span class="text-xs text-sand/50">${filtered.length} iniciativas</span>
    </div>` + tableHTML(filtered, [
      { k:"Estado", label:"Estado", f:estadoBadge },
      { k:"Q facturación", label:"Q" },
      { k:"Código Pedido", label:"Pedido" },
      { k:"Detalle", label:"Proyecto" },
      { k:"Horas propuesta", label:"Horas", r:true, f:hCell },
      { k:"Estado facturación", label:"Facturación" },
      { k:"Horas ejecutadas", label:"Ejecutadas", r:true, f:hCell },
      { k:"¿Ejecutado?", label:"Ejecución", f:estadoBadge },
    ]);
  document.getElementById("ini-q").onchange = e=>{ state._iniQ=e.target.value; renderIniciativas(); };
}

/* ---------- BOLSA / ADELANTOS ---------- */
function renderBolsa(){
  const bolsa = state.data.bolsa || [], adel = state.data.adelantos || [];
  panel.innerHTML =
    `<h3 class="mb-2 font-display text-lg font-bold text-sand">Bolsa BBVA</h3>` +
    tableHTML(bolsa, [
      { k:"Responsable BBVA", label:"Responsable" },
      { k:"Proyecto", label:"Proyecto / Detalle", f:(v,d)=> v||d["Detalle / Motivo"]||'<span class="text-sand/25">—</span>' },
      { k:"Horas adelantadas", label:"Adelantadas", r:true, f:hCell },
      { k:"Horas consumidas", label:"Consumidas", r:true, f:hCell },
      { k:"Horas", label:"Restante", r:true, f:hCell },
    ]) +
    `<h3 class="mb-2 mt-6 font-display text-lg font-bold text-sand">Adelantos</h3>` +
    tableHTML(adel, [
      { k:"Responsable BBVA", label:"Responsable" },
      { k:"Proyecto", label:"Proyecto" },
      { k:"Horas adelantadas", label:"Adelantadas", r:true, f:hCell },
      { k:"Horas consumidas", label:"Consumidas", r:true, f:hCell },
      { k:"Horas", label:"Restante", r:true, f:hCell },
      { k:"Importe", label:"Importe", r:true, f:v=> v===""||v==null?'':eur.format(v) },
    ]);
}

/* ---------- ENCUESTAS ---------- */
function renderEncuestas(){
  const recs = (state.data.encuestasQ4 && state.data.encuestasQ4.length) ? state.data.encuestasQ4 : (state.data.encuestasQ1||[]);
  panel.innerHTML = tableHTML(recs, [
    { k:"Código de proyecto/servicio", label:"Código" },
    { k:"NOMBRE DEL PROYECTO/SERVICIO", label:"Proyecto" },
    { k:"SATISFACCIÓN ENTREGA", label:"Satisf.", r:true },
    { k:"CONSIGUE RESULTADOS", label:"Resultados", r:true },
    { k:"CONOCIMIENTO TÉCNICO ADECUADO", label:"Conocim.", r:true },
    { k:"CALIDAD TOTAL NUEVA", label:"Calidad", r:true },
  ]);
}

/* ---------- EJECUCIÓN: redistribución de horas por Q ---------- */
const ejecOverrides = {}; // { proyecto: { Q: horas } }
function renderEjecucion(){
  const ej = state.data.ejecucion || {qColumns:[],records:[],totalesHorasQ:{}};
  const qs = ej.qColumns;
  const tot = totalesHorasPorQ(ej.records, qs, ejecOverrides);
  panel.innerHTML = `
    <div class="mb-5 grid grid-cols-2 gap-3 sm:grid-cols-4">
      ${qs.map(q=>KPI("Horas "+q, h(tot[q]))).join("")}
    </div>
    <div class="glass overflow-x-auto rounded-2xl p-4">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-serene/80">
          <th class="p-2">Proyecto</th>${qs.map(q=>`<th class="p-2 text-right">${q}</th>`).join("")}
        </tr></thead>
        <tbody>
          ${ej.records.map(rec=>{ const name=rec.data["Proyecto"]||"—"; return `<tr class="border-t border-serene/10">
            <td class="p-2 text-sand">${name}</td>
            ${qs.map(q=>{ const ov=ejecOverrides[name]; const val= ov&&q in ov? ov[q] : num(rec.data[q]);
              return `<td class="p-2 text-right"><input type="number" class="w-24 text-right" value="${val}"
                data-proj="${encodeURIComponent(name)}" data-q="${q}"></td>`; }).join("")}
          </tr>`; }).join("")}
        </tbody>
      </table>
      <p class="mt-3 text-xs text-sand/50">Edita las horas para simular cómo repartir un proyecto entre trimestres. Los totales de arriba se recalculan al instante.</p>
    </div>`;
  panel.querySelectorAll("input[data-proj]").forEach(inp=>{
    inp.addEventListener("input",()=>{ const p=decodeURIComponent(inp.dataset.proj), q=inp.dataset.q;
      (ejecOverrides[p]=ejecOverrides[p]||{})[q]=num(inp.value);
      const t=totalesHorasPorQ(ej.records,qs,ejecOverrides);
      qs.forEach((qq,i)=>{ panel.querySelectorAll(".glass .font-display")[i].textContent=h(t[qq]); });
    });
  });
}

/* ---------- ECONOMÍA: simulador de rentabilidad ---------- */
const ecoScenario = {}; // por Q: { quitar:[], dedicacion:{}, tarifa, gastos, horas }
function renderEconomia(){
  const blocks = (state.data.economico && state.data.economico.bloques) || [];
  if(!blocks.length){ panel.innerHTML=`<div class="glass rounded-2xl p-6 text-sand/70">No hay bloques de Control Económico.</div>`; return; }
  const qSel = state._ecoQ || blocks[0].q; state._ecoQ=qSel;
  const block = blocks.find(b=>b.q===qSel)||blocks[0];
  const sc = ecoScenario[qSel] = ecoScenario[qSel] || { quitar:[], dedicacion:{},
    tarifa: pickTarifa(qSel), gastos:0, horas: (state.data.ejecucion.totalesHorasQ||{})[qSel] || 0 };

  panel.innerHTML = `
    <div class="mb-5 flex flex-wrap items-end gap-4">
      <label class="text-xs text-serene/80">Trimestre
        <select id="eco-q" class="ml-2">${blocks.map(b=>`<option ${b.q===qSel?"selected":""}>${b.q}</option>`).join("")}</select></label>
      <label class="text-xs text-serene/80">Tarifa €/h <input id="eco-tarifa" type="number" step="0.01" class="ml-2 w-24" value="${sc.tarifa}"></label>
      <label class="text-xs text-serene/80">Horas Q <input id="eco-horas" type="number" class="ml-2 w-28" value="${sc.horas}"></label>
      <label class="text-xs text-serene/80">Gastos € <input id="eco-gastos" type="number" class="ml-2 w-28" value="${sc.gastos}"></label>
    </div>
    <div id="eco-kpis" class="mb-5 grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-6"></div>
    <div class="glass rounded-2xl p-4">
      <div class="mb-2 flex items-center justify-between">
        <h3 class="font-display text-lg font-bold text-sand">Equipo · escenario</h3>
        <button id="eco-add" class="chip rounded-full px-3 py-1.5 text-xs font-bold hover:bg-white/10">+ Añadir persona</button>
      </div>
      <div class="overflow-x-auto"><table class="w-full text-sm">
        <thead><tr class="text-left text-serene/70"><th class="p-2"></th><th class="p-2">Persona</th><th class="p-2">Equipo</th>
          <th class="p-2 text-right">€/h</th><th class="p-2">Dedicación</th><th class="p-2 text-right">Coste Q</th></tr></thead>
        <tbody id="eco-personas"></tbody>
      </table></div>
      <p class="mt-3 text-xs text-sand/50">Desmarca para "quitar", mueve la dedicación o añade personas: la rentabilidad de arriba cambia al instante. (Nada se guarda en el Excel.)</p>
    </div>`;

  document.getElementById("eco-q").onchange = e=>{ state._ecoQ=e.target.value; renderEconomia(); };
  ["tarifa","horas","gastos"].forEach(k=>{
    document.getElementById("eco-"+k).addEventListener("input", e=>{ sc[k]=num(e.target.value); recompute(); });
  });
  document.getElementById("eco-add").onclick = ()=>{
    const nombre = prompt("Nombre de la persona nueva:"); if(!nombre) return;
    const equipo = (prompt("Equipo (NFQ/NTER):","NFQ")||"NFQ").toUpperCase();
    const costeHora = num(prompt("Coste €/hora:","30"));
    sc.dedicacion[nombre]=1;
    (sc.anadir=sc.anadir||[]).push({equipo,nombre,costeHora,horasTeoricas:[160,160,160],dedicacion:[1,1,1],ausencias:[0,0,0]});
    renderEconomia();
  };

  function currentPersonas(){
    let ps = aplicarEscenarioPersonas(block.personas, { quitar:sc.quitar, dedicacion:sc.dedicacion });
    if(sc.anadir) ps = ps.concat(sc.anadir.filter(a=>sc.quitar.indexOf(a.nombre)<0));
    return ps;
  }
  function recompute(){
    const ps = currentPersonas();
    const eco = economiaQ({ personas:ps, horasTotalesQ:sc.horas, tarifa:sc.tarifa, gastos:sc.gastos,
      objNFQ:block.rentObjetivoNFQ||0.25, objNTER:block.rentObjetivoNTER||0.20 });
    const real = eco.rentabilidadReal;
    const ok = real!=null && real>=eco.rentObjetivoTotal;
    document.getElementById("eco-kpis").innerHTML =
      KPI("Ingreso real", eur.format(eco.ingresoReal)) +
      KPI("Coste total", eur.format(eco.costeTotal), "mandarin") +
      KPI("Coste NFQ / NTER", eur.format(eco.costeNFQ)+" / "+eur.format(eco.costeNTER)) +
      KPI("Rent. objetivo", pct(eco.rentObjetivoTotal)) +
      KPI("Ingreso objetivo", eur.format(eco.ingresoObjetivo)+" · "+h(eco.ingresoObjetivoHoras)) +
      KPI("Rentabilidad real", pct(real), ok?"lime":"mandarin");
  }
  function renderPersonas(){
    const all = block.personas.concat(sc.anadir||[]);
    document.getElementById("eco-personas").innerHTML = all.map(p=>{
      const quitada = sc.quitar.indexOf(p.nombre)>=0;
      const ded = sc.dedicacion[p.nombre]!=null ? sc.dedicacion[p.nombre] : (p.dedicacion?p.dedicacion[0]:1);
      const coste = quitada?0: costePersonaQ({...p, dedicacion:(p.dedicacion||[0,0,0]).map(()=>ded)});
      return `<tr class="border-t border-serene/10 ${quitada?'opacity-40':''}">
        <td class="p-2"><input type="checkbox" data-q="${encodeURIComponent(p.nombre)}" ${quitada?'':'checked'}></td>
        <td class="p-2 text-sand">${p.nombre}</td>
        <td class="p-2"><span class="chip rounded-full px-2 py-0.5 text-[11px]">${p.equipo}</span></td>
        <td class="p-2 text-right">${num(p.costeHora).toFixed(1)}</td>
        <td class="p-2"><input type="range" min="0" max="1" step="0.25" value="${ded}" data-d="${encodeURIComponent(p.nombre)}"> <span class="text-xs text-sand/60">${pct(ded)}</span></td>
        <td class="p-2 text-right text-sand">${eur.format(coste)}</td></tr>`;
    }).join("");
    document.querySelectorAll("#eco-personas input[type=checkbox]").forEach(cb=>cb.addEventListener("change",e=>{
      const n=decodeURIComponent(cb.dataset.q); const i=sc.quitar.indexOf(n);
      if(cb.checked){ if(i>=0)sc.quitar.splice(i,1); } else if(i<0) sc.quitar.push(n);
      renderPersonas(); recompute();
    }));
    document.querySelectorAll("#eco-personas input[type=range]").forEach(r=>r.addEventListener("input",e=>{
      sc.dedicacion[decodeURIComponent(r.dataset.d)]=num(r.value); renderPersonas(); recompute();
    }));
  }
  renderPersonas(); recompute();
}
function pickTarifa(q){ const t=state.data.tarifas||{}; return t[q] || t[q.slice(0,4)] || t["2026"] || 51.22; }

/* ---------- CAPACIDAD ---------- */
function renderCapacidad(){
  const blocks = (state.data.capacidad && state.data.capacidad.bloques) || [];
  if(!blocks.length){ panel.innerHTML=`<div class="glass rounded-2xl p-6 text-sand/70">No hay bloques de Capacidad.</div>`; return; }
  const qSel = state._capQ || blocks[0].q; state._capQ=qSel;
  const b = blocks.find(x=>x.q===qSel)||blocks[0];
  panel.innerHTML = `
    <div class="mb-5 flex flex-wrap items-end gap-4">
      <label class="text-xs text-serene/80">Trimestre
        <select id="cap-q" class="ml-2">${blocks.map(x=>`<option ${x.q===qSel?"selected":""}>${x.q}</option>`).join("")}</select></label>
      <span class="text-xs text-sand/60">Horas/persona Q: <b class="text-sand">${h(b.horasQ)}</b></span>
    </div>
    <div class="grid gap-5 lg:grid-cols-2">
      <div class="glass rounded-2xl p-4">
        <h3 class="mb-3 font-display text-lg font-bold text-sand">Cobertura por proyecto</h3>
        <table class="w-full text-sm"><thead><tr class="text-left text-serene/70">
          <th class="p-2">Proyecto</th><th class="p-2 text-right">Horas</th><th class="p-2 text-right">Cobertura</th></tr></thead>
          <tbody>${(b.proyectos||[]).map(p=>{ const cob=coberturaProyecto(p,b.horasQ);
            const c = cob>=1? "lime" : cob>=0.8? "canary":"mandarin";
            return `<tr class="border-t border-serene/10"><td class="p-2 text-sand">${p.nombre}</td>
              <td class="p-2 text-right">${h(p.horas)}</td>
              <td class="p-2 text-right font-bold text-${c}">${pct(cob)}</td></tr>`; }).join("")}</tbody></table>
      </div>
      <div class="glass rounded-2xl p-4">
        <h3 class="mb-3 font-display text-lg font-bold text-sand">Capacidad por persona</h3>
        <div class="space-y-2">${(b.capacidadPersona||[]).map(cp=>{ const v=num(cp.capacidad);
          const c = v>1.05?"mandarin": v>=0.8?"lime":"serene"; const w=Math.min(100,v*100);
          return `<div><div class="flex justify-between text-xs"><span class="text-sand">${cp.persona}</span><span class="text-${c}">${pct(v)}</span></div>
            <div class="mt-1 h-2 rounded-full bg-white/10"><div class="h-2 rounded-full bg-${c}" style="width:${w}%"></div></div></div>`; }).join("")}</div>
      </div>
    </div>`;
  document.getElementById("cap-q").onchange=e=>{ state._capQ=e.target.value; renderCapacidad(); };
}

/* ===========================================================================
 * ARRANQUE
 * =========================================================================== */
async function boot(){
  await loadSnapshot();
  document.getElementById("mode-badge").textContent = state.demo ? "modo demo (sin backend)" : "datos en vivo";
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
  document.getElementById("btn-reload").onclick = async()=>{ await loadSnapshot();
    document.getElementById("mode-badge").textContent = state.demo?"modo demo (sin backend)":"datos en vivo"; setTab(activeTab); };
  setTab("iniciativas");
}

(function auth(){
  const AUTH_KEY="rdr_auth_email";
  const CLIENT_ID="535974839401-54e3t5n61nbc0c31corcfr56gplj8svl.apps.googleusercontent.com";
  let TEAM=[];
  const ok=(e)=>{ e=String(e||"").trim().toLowerCase(); return !!e && TEAM.some(p=>
    String(p.email||"").toLowerCase()===e || String(p.emailBBVA||"").toLowerCase()===e); };
  const jwt=(t)=>{ try{ return JSON.parse(decodeURIComponent(escape(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))))); }catch(e){ return null; } };
  function entrar(){
    document.body.classList.add("authed");
    // El #auth-gate lleva display:flex INLINE, que gana a la regla CSS
    // body.authed #auth-gate{display:none}. Hay que ocultarlo por JS.
    var g = document.getElementById("auth-gate");
    if (g) g.style.display = "none";
    boot();
  }
  async function team(){ try{ TEAM=(await fetch("equipo/equipo.json",{cache:"no-store"}).then(r=>r.json())).team||[]; }catch(e){ TEAM=[]; } }
  async function onCred(resp){ const d=jwt(resp&&resp.credential); await team();
    const mail=d&&d.email_verified&&d.email?d.email:null;
    if(mail&&ok(mail)){ localStorage.setItem(AUTH_KEY,mail.toLowerCase()); entrar(); }
    else { document.getElementById("auth-msg").textContent = d&&d.email
      ? "El correo "+d.email+" no pertenece al equipo RDR." : "No se pudo verificar el correo."; } }
  (function(){
    // control.html NO tiene login propio: usa la sesión del hub (localStorage
    // compartido). Si hay sesión -> entra. Si no -> manda al hub a loguearse.
    // (El Google Sign-In duplicado de aquí era lo que se quedaba atascado.)
    const cached = localStorage.getItem(AUTH_KEY);
    if (cached) { entrar(); return; }
    const msg = document.getElementById("auth-msg");
    if (msg) msg.textContent = "No hay sesión. Te llevamos al hub para iniciar sesión…";
    const btn = document.getElementById("g-btn");
    if (btn) btn.innerHTML = '<a href="index.html" style="display:inline-block;background:#001391;color:#F7F8F8;border-radius:999px;padding:11px 24px;font-weight:700;text-decoration:none">Ir al hub para iniciar sesión</a>';
    setTimeout(function(){ location.href = "index.html"; }, 1800);
  })();
})();
</script>
